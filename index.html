<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKOUT DISTRICT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050605;font-family:"Courier New",monospace;color:#d6d2c2}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px #000}.top{position:absolute;left:22px;top:14px;font-size:12px;letter-spacing:2px}.rec-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a72720;margin-right:8px;box-shadow:0 0 8px #a72720}.time{margin-left:10px;opacity:.75}.bottom{position:absolute;left:22px;bottom:18px}.health{font-size:10px;letter-spacing:2px}.bar{width:210px;height:7px;border:1px solid rgba(210,205,180,.6);margin-top:5px;padding:1px}.fill{height:100%;width:100%;background:#a8a58e}.objective{position:absolute;right:22px;top:16px;text-align:right;font-size:11px;letter-spacing:1px}.objective b{display:block;color:#eee;font-size:13px;margin-top:5px}.cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.45}.cross:before,.cross:after{content:"";position:absolute;background:#eee}.cross:before{width:12px;height:1px;top:5px}.cross:after{height:12px;width:1px;left:5px}.prompt{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);border:1px solid rgba(220,215,190,.25);background:rgba(0,0,0,.72);padding:7px 12px;font-size:11px;letter-spacing:1px;display:none}.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen}.noise{position:absolute;inset:-20%;opacity:.10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:noise .16s steps(2) infinite}@keyframes noise{0%{transform:translate(0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}}
#start{position:absolute;inset:0;background:rgba(3,4,3,.82);display:flex;align-items:center;justify-content:center;z-index:20}.panel{text-align:center;letter-spacing:4px}.panel h1{font-size:38px;margin:0 0 10px;font-weight:900;text-shadow:4px 4px #64140f}.panel p{letter-spacing:1px;font-size:11px;color:#aaa58e}.panel button{pointer-events:auto;margin-top:18px;background:transparent;border:1px solid #aaa58e;color:#ddd;font-family:inherit;padding:12px 24px;letter-spacing:3px;cursor:pointer}.controls{position:absolute;bottom:20px;width:100%;text-align:center;font-size:9px;opacity:.55}
#touch{display:none;position:absolute;inset:0;pointer-events:none}.stick{position:absolute;left:22px;bottom:28px;width:120px;height:120px;border:1px solid rgba(220,220,200,.12);border-radius:50%;pointer-events:auto}.stick i{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:rgba(220,220,200,.12)}.act{position:absolute;right:20px;bottom:35px;width:68px;height:68px;border-radius:50%;border:1px solid rgba(220,220,200,.25);pointer-events:auto;text-align:center;padding-top:24px;font-size:10px}.act2{right:96px;bottom:118px}@media(pointer:coarse){#touch{display:block}.cross{display:none}.controls{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><span class="rec-dot"></span>REC<span class="time" id="clock">00:00:00</span></div><div class="objective">CURRENT OBJECTIVE<b id="objective">REACH THE SAFEHOUSE</b></div><div class="bottom"><div class="health">VITALS</div><div class="bar"><div class="fill" id="health"></div></div></div><div class="cross"></div><div class="prompt" id="prompt"></div><div class="scanlines"></div><div class="noise"></div></div>
<div id="start"><div class="panel"><h1>BLACKOUT DISTRICT</h1><p>THE CAMERAS NEVER STOP RECORDING</p><button id="play">ENTER THE DISTRICT</button><div class="controls">WASD MOVE · SHIFT RUN · C CROUCH · E INTERACT / TAKEDOWN · F THROW · LEFT CLICK ATTACK</div></div></div>
<div id="touch"><div class="stick" id="stick"><i id="stickknob"></i></div><div class="act" id="use">USE</div><div class="act act2" id="throw">THROW</div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d0c);scene.fog=new THREE.FogExp2(0x0b0d0c,.0011);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,5000);
const hemi=new THREE.HemisphereLight(0xd0d3bd,0x1a1b17,1.15);scene.add(hemi);
const ambient=new THREE.AmbientLight(0xc0c2ad,.65);scene.add(ambient);
const playerLamp=new THREE.SpotLight(0xe1d6a9,3.8,520,.48,.65,1.35);scene.add(playerLamp);scene.add(playerLamp.target);
const moon=new THREE.DirectionalLight(0xb4bfae,1.25);moon.position.set(-400,900,300);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);moon.shadow.camera.left=-700;moon.shadow.camera.right=700;moon.shadow.camera.top=700;moon.shadow.camera.bottom=-700;scene.add(moon);
const world={w:1800,h:1300};
const player={x:900,y:900,a:-Math.PI/2,health:100,crouch:false,weapon:null,noise:0,step:0,mesh:null};
const obstacles=[{x:0,y:0,w:1800,h:170},{x:0,y:1130,w:1800,h:170},{x:0,y:170,w:170,h:960},{x:1630,y:170,w:170,h:960},{x:360,y:300,w:110,h:430},{x:650,y:170,w:120,h:380},{x:650,y:700,w:120,h:310},{x:960,y:360,w:380,h:110},{x:960,y:740,w:110,h:390},{x:1280,y:740,w:120,h:390},{x:360,y:850,w:290,h:100}];
const items=[{x:535,y:1040,type:'knife',name:'RUSTED KNIFE',taken:false},{x:1140,y:540,type:'bat',name:'WOODEN BAT',taken:false},{x:1450,y:1010,type:'pipe',name:'IRON PIPE',taken:false},{x:900,y:830,type:'brick',name:'BRICK',taken:false},{x:260,y:910,type:'med',name:'MEDKIT',taken:false}];
const enemies=[{x:780,y:260,a:1.2,path:[{x:780,y:260},{x:780,y:630}],pi:1,alert:0,alive:true},{x:1220,y:600,a:2.8,path:[{x:1220,y:600},{x:1500,y:600},{x:1500,y:990},{x:1220,y:990}],pi:1,alert:0,alive:true},{x:280,y:500,a:0,path:[{x:280,y:500},{x:280,y:760}],pi:1,alert:0,alive:true},{x:1080,y:1080,a:-1.5,path:[{x:1080,y:1080},{x:1080,y:900}],pi:1,alert:0,alive:true}];
let started=false,last=performance.now(),gameOver=false,elapsed=0,thrown=[];
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='f')throwWeapon()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';last=performance.now()};

const ground=new THREE.Mesh(new THREE.PlaneGeometry(world.w,world.h),new THREE.MeshStandardMaterial({color:0x34372f,roughness:.95,emissive:0x10110e,emissiveIntensity:.35}));ground.rotation.x=-Math.PI/2;ground.position.set(world.w/2,0,world.h/2);ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(world.w,40,0x252824,0x252824);grid.position.set(world.w/2,.025,world.h/2);grid.material.opacity=.16;grid.material.transparent=true;scene.add(grid);
function box(x,z,w,d,h,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.88,metalness:.12}));m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
for(const o of obstacles)box(o.x+o.w/2,o.y+o.h/2,o.w,o.h,o.y===0||o.y===1130?170:150,0x252722);
// Add brick texture accents and shuttered storefronts
for(let i=0;i<160;i++){const x=190+(i*283)%1420,z=190+(i*179)%900;box(x,z,12+(i%5)*3,.5,.08,0x111310)}
box(505,208,230,18,300,0x111210);box(860,205,180,16,300,0x10110f);

function makePerson(enemy=false){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:enemy?0x30322d:0x777762,roughness:.8});const body=new THREE.Mesh(new THREE.CapsuleGeometry(13,25,4,8),mat);body.position.y=38;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(10,12,8),new THREE.MeshStandardMaterial({color:0x56584f,roughness:.9}));head.position.y=72;head.castShadow=true;g.add(head);const legMat=new THREE.MeshStandardMaterial({color:0x171815,roughness:.9});for(const s of [-7,7]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(4,18,3,6),legMat);leg.position.set(s,18,0);leg.castShadow=true;g.add(leg)}const armL=new THREE.Mesh(new THREE.CapsuleGeometry(3.5,20,3,6),mat);armL.position.set(-16,43,0);armL.rotation.z=.12;g.add(armL);const armR=armL.clone();armR.position.x=16;armR.rotation.z=-.12;g.add(armR);g.userData={legs:g.children.slice(2,4),arms:[armL,armR]};scene.add(g);return g}
player.mesh=makePerson(false);player.mesh.scale.y=.95;
const enemyMeshes=[];for(const e of enemies){e.mesh=makePerson(true);enemyMeshes.push(e.mesh)}
const itemMeshes=[];for(const i of items){let geo=i.type==='med'?new THREE.BoxGeometry(20,12,16):i.type==='brick'?new THREE.BoxGeometry(24,10,14):(i.type==='knife'?new THREE.BoxGeometry(30,3,5):new THREE.BoxGeometry(36,5,5));const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:i.type==='med'?0xa8a58e:0x96947f,roughness:.75,metalness:i.type==='knife'||i.type==='pipe'?'.4':'.05'}));m.position.set(i.x,8,i.y);m.rotation.y=i.type==='knife'?-0.6:.3;m.castShadow=true;scene.add(m);i.mesh=m}
const lights=[];const lightPoints=[[520,970],[850,520],[1120,500],[1410,1060],[300,330],[760,920]];for(let i=0;i<lightPoints.length;i++){const [x,z]=lightPoints[i];const bulb=new THREE.PointLight(0xd6bd86,i%2?1.4:1.7,260,1.7);bulb.position.set(x,95,z);bulb.castShadow=i<4;scene.add(bulb);lights.push(bulb);box(x,z,6,6,110,0x151613);if(i%2===0){const barrel=new THREE.Mesh(new THREE.CylinderGeometry(18,18,28,10),new THREE.MeshStandardMaterial({color:0x35291d,roughness:1}));barrel.position.set(x,z+30,14);barrel.rotation.x=Math.PI/2;scene.add(barrel);box(x,z+30,34,34,28,0x34291b)}}

function blocked(x,y,r=14){if(x<r||y<r||x>world.w-r||y>world.h-r)return true;return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function moveCircle(o,dx,dy,r){if(!blocked(o.x+dx,o.y,r))o.x+=dx;if(!blocked(o.x,o.y+dy,r))o.y+=dy}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angleDiff(a,b){let d=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI;return d}
function isDark(x,y){for(const l of lightPoints)if(Math.hypot(x-l[0],y-l[1])<170)return false;return true}
function lineBlocked(x1,y1,x2,y2){const n=10;for(let i=1;i<n;i++){let t=i/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(blocked(x,y,2))return true}return false}
function promptText(t){const p=document.getElementById('prompt');p.textContent=t;p.style.display=t?'block':'none'}
function interact(){const nearItem=items.find(i=>!i.taken&&dist(player,i)<55);if(nearItem){nearItem.taken=true;nearItem.mesh.visible=false;if(nearItem.type==='med')player.health=Math.min(100,player.health+35);else player.weapon=nearItem.type;player.noise=35;return}const enemy=enemies.find(e=>e.alive&&dist(player,e)<55&&Math.abs(angleDiff(player.a,Math.atan2(e.y-player.y,e.x-player.x)))<1.25);if(enemy){enemy.alive=false;enemy.mesh.visible=false;player.weapon='';player.noise=20}}
function attack(){if(!player.weapon)return;for(const e of enemies)if(e.alive&&dist(player,e)<75){e.alive=false;e.mesh.visible=false;break}player.noise=60}
function throwWeapon(){if(!player.weapon)return;thrown.push({x:player.x,y:player.y,vx:Math.cos(player.a)*520,vy:Math.sin(player.a)*520,life:1.4,mesh:null});player.weapon=null;player.noise=45}
addEventListener('mousedown',()=>{if(started&&!gameOver)attack()});
document.getElementById('use').ontouchstart=e=>{e.preventDefault();interact()};document.getElementById('throw').ontouchstart=e=>{e.preventDefault();throwWeapon()};
let stickX=0,stickY=0;const stick=document.getElementById('stick'),knob=document.getElementById('stickknob');stick.addEventListener('touchmove',e=>{e.preventDefault();const r=stick.getBoundingClientRect(),t=e.touches[0];let x=t.clientX-(r.left+60),y=t.clientY-(r.top+60);const l=Math.hypot(x,y)||1;if(l>42){x=x/l*42;y=y/l*42}stickX=x/42;stickY=y/42;knob.style.transform=`translate(${x}px,${y}px)`},{passive:false});stick.addEventListener('touchend',()=>{stickX=stickY=0;knob.style.transform=''});

function update(dt){if(!started||gameOver)return;elapsed+=dt;player.crouch=!!keys['c'];let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;if(Math.abs(stickX)+Math.abs(stickY)>0){dx=stickX;dy=-stickY}const len=Math.hypot(dx,dy);if(len>0){dx/=len;dy/=len;const running=!!keys['shift']&&!player.crouch;const speed=player.crouch?75:(running?245:145);moveCircle(player,dx*speed*dt,dy*speed*dt,16);player.a=Math.atan2(dy,dx);player.step+=dt*(running?12:7);if(running&&!isDark(player.x,player.y))player.noise=Math.max(player.noise,15)}
for(const t of thrown){t.x+=t.vx*dt;t.y+=t.vy*dt;t.vx*=.985;t.vy*=.985;t.life-=dt;for(const e of enemies)if(e.alive&&Math.hypot(t.x-e.x,t.y-e.y)<28){e.alive=false;e.mesh.visible=false}}thrown=thrown.filter(t=>t.life>0&&!blocked(t.x,t.y,5));
for(const e of enemies){if(!e.alive)continue;const d=dist(player,e),dark=isDark(player.x,player.y),visible=!dark&&d<330&&Math.abs(angleDiff(e.a,Math.atan2(player.y-e.y,player.x-e.x)))<.72&&!lineBlocked(e.x,e.y,player.x,player.y);if(visible||(d<75&&player.noise>5))e.alert=Math.min(1,e.alert+dt*.8);else e.alert=Math.max(0,e.alert-dt*.35);if(e.alert>.15){e.a=Math.atan2(player.y-e.y,player.x-e.x);if(d<28)player.health-=dt*28;if(d>38)moveCircle(e,Math.cos(e.a)*145*dt,Math.sin(e.a)*145*dt,14)}else{const p=e.path[e.pi],pa=Math.atan2(p.y-e.y,p.x-e.x);e.a=pa;if(dist(e,p)<12)e.pi=(e.pi+1)%e.path.length;moveCircle(e,Math.cos(pa)*62*dt,Math.sin(pa)*62*dt,14)}}player.noise=Math.max(0,player.noise-dt*20);if(player.health<=0)gameOver=true;
const nearItem=items.find(i=>!i.taken&&dist(player,i)<55),nearEnemy=enemies.find(e=>e.alive&&dist(player,e)<55&&Math.abs(angleDiff(player.a,Math.atan2(e.y-player.y,e.x-player.x)))<1.25);promptText(nearItem?'[ E ] '+nearItem.name:(nearEnemy?'[ E ] EXECUTE TAKEDOWN':''));document.getElementById('health').style.width=Math.max(0,player.health)+'%';document.getElementById('clock').textContent='00:'+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');
}

function syncScene(){player.mesh.position.set(player.x,0,player.y);player.mesh.rotation.y=-player.a+Math.PI/2;player.mesh.scale.y=player.crouch?.72:.95;const swing=Math.sin(player.step)*.55;if(player.mesh.userData.legs){player.mesh.userData.legs[0].rotation.x=swing;player.mesh.userData.legs[1].rotation.x=-swing}for(let i=0;i<enemies.length;i++){const e=enemies[i];e.mesh.position.set(e.x,0,e.y);e.mesh.rotation.y=-e.a+Math.PI/2}for(const t of thrown){if(!t.mesh){t.mesh=new THREE.Mesh(new THREE.BoxGeometry(28,5,5),new THREE.MeshStandardMaterial({color:0xaaa58e,metalness:.25}));scene.add(t.mesh)}t.mesh.position.set(t.x,12,t.y);t.mesh.rotation.y=elapsed*8}for(let i=0;i<lights.length;i++)lights[i].intensity=(.55+Math.abs(Math.sin(elapsed*7+i*2))*1.2)*(.94+(Math.sin(elapsed*19+i)>-.97?0:.35));
const behind=new THREE.Vector3(Math.cos(player.a)*-220,210,Math.sin(player.a)*-220);camera.position.lerp(new THREE.Vector3(player.x+behind.x,behind.y,player.y+behind.z),.09);camera.lookAt(player.x,48,player.y);
playerLamp.position.set(player.x,150,player.y);playerLamp.target.position.set(player.x+Math.cos(player.a)*280,25,player.y+Math.sin(player.a)*280);playerLamp.intensity=player.crouch?2.4:3.8;
}
function render(){renderer.render(scene,camera)}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);syncScene();render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>

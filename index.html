<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKOUT DISTRICT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050605;font-family:"Courier New",monospace;color:#d6d2c2}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px #000}.top{position:absolute;left:22px;top:14px;font-size:12px;letter-spacing:2px}.rec-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a72720;margin-right:8px;box-shadow:0 0 8px #a72720}.time{margin-left:10px;opacity:.75}.bottom{position:absolute;left:22px;bottom:18px}.health{font-size:10px;letter-spacing:2px}.bar{width:210px;height:7px;border:1px solid rgba(210,205,180,.6);margin-top:5px;padding:1px}.fill{height:100%;width:100%;background:#a8a58e}.objective{position:absolute;right:22px;top:16px;text-align:right;font-size:11px;letter-spacing:1px}.objective b{display:block;color:#eee;font-size:13px;margin-top:5px}.cross{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.45}.cross:before,.cross:after{content:"";position:absolute;background:#eee}.cross:before{width:12px;height:1px;top:5px}.cross:after{height:12px;width:1px;left:5px}.prompt{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);border:1px solid rgba(220,215,190,.25);background:rgba(0,0,0,.72);padding:7px 12px;font-size:11px;letter-spacing:1px;display:none}.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen}.noise{position:absolute;inset:-20%;opacity:.10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:noise .16s steps(2) infinite}@keyframes noise{0%{transform:translate(0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}}
#start{position:absolute;inset:0;background:rgba(3,4,3,.82);display:flex;align-items:center;justify-content:center;z-index:20}.panel{text-align:center;letter-spacing:4px}.panel h1{font-size:38px;margin:0 0 10px;font-weight:900;text-shadow:4px 4px #64140f}.panel p{letter-spacing:1px;font-size:11px;color:#aaa58e}.panel button{pointer-events:auto;margin-top:18px;background:transparent;border:1px solid #aaa58e;color:#ddd;font-family:inherit;padding:12px 24px;letter-spacing:3px;cursor:pointer}.controls{position:absolute;bottom:20px;width:100%;text-align:center;font-size:9px;opacity:.55}
#touch{display:none;position:absolute;inset:0;pointer-events:none}.stick{position:absolute;left:22px;bottom:28px;width:120px;height:120px;border:1px solid rgba(220,220,200,.12);border-radius:50%;pointer-events:auto}.stick i{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:rgba(220,220,200,.12)}.act{position:absolute;right:20px;bottom:35px;width:68px;height:68px;border-radius:50%;border:1px solid rgba(220,220,200,.25);pointer-events:auto;text-align:center;padding-top:24px;font-size:10px}.act2{right:96px;bottom:118px}
@media(pointer:coarse){#touch{display:block}.cross{display:none}.controls{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="hud"><div class="top"><span class="rec-dot"></span>REC<span class="time" id="clock">00:00:00</span></div><div class="objective">CURRENT OBJECTIVE<b id="objective">REACH THE SAFEHOUSE</b></div><div class="bottom"><div class="health">VITALS</div><div class="bar"><div class="fill" id="health"></div></div></div><div class="cross"></div><div class="prompt" id="prompt"></div><div class="scanlines"></div><div class="noise"></div></div>
<div id="start"><div class="panel"><h1>BLACKOUT DISTRICT</h1><p>THE CAMERAS NEVER STOP RECORDING</p><button id="play">ENTER THE DISTRICT</button><div class="controls">WASD MOVE · SHIFT RUN · C CROUCH · E INTERACT / TAKEDOWN · F THROW · LEFT CLICK ATTACK</div></div></div>
<div id="touch"><div class="stick" id="stick"><i id="stickknob"></i></div><div class="act" id="use">USE</div><div class="act act2" id="throw">THROW</div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLower]}); // placeholder
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const world={w:1800,h:1300};const player={x:900,y:1100,a:-Math.PI/2,vx:0,vy:0,health:100,crouch:false,weapon:null,noise:0,step:0};
const obstacles=[{x:0,y:0,w:1800,h:170},{x:0,y:1130,w:1800,h:170},{x:0,y:170,w:170,h:960},{x:1630,y:170,w:170,h:960},{x:360,y:300,w:110,h:430},{x:650,y:170,w:120,h:380},{x:650,y:700,w:120,h:310},{x:960,y:360,w:380,h:110},{x:960,y:740,w:110,h:390},{x:1280,y:740,w:120,h:390},{x:360,y:850,w:290,h:100}];
const items=[{x:535,y:1040,type:'knife',name:'RUSTED KNIFE',taken:false},{x:1140,y:540,type:'bat',name:'WOODEN BAT',taken:false},{x:1450,y:1010,type:'pipe',name:'IRON PIPE',taken:false},{x:900,y:830,type:'brick',name:'BRICK',taken:false},{x:260,y:910,type:'med',name:'MEDKIT',taken:false}];
const enemies=[{x:780,y:260,a:1.2,path:[{x:780,y:260},{x:780,y:630}],pi:1,alert:0,alive:true},{x:1220,y:600,a:2.8,path:[{x:1220,y:600},{x:1500,y:600},{x:1500,y:990},{x:1220,y:990}],pi:1,alert:0,alive:true},{x:280,y:500,a:0,path:[{x:280,y:500},{x:280,y:760}],pi:1,alert:0,alive:true},{x:1080,y:1080,a:-1.5,path:[{x:1080,y:1080},{x:1080,y:900}],pi:1,alert:0,alive:true}];
let cam={x:0,y:0},started=false,last=performance.now(),gameOver=false,elapsed=0,thrown=[];let mouseX=0,mouseY=0;
canvas.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});canvas.addEventListener('mousedown',e=>{if(started&&!gameOver)attack()});
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';last=performance.now()};
function blocked(x,y,r=14){if(x<r||y<r||x>world.w-r||y>world.h-r)return true;return obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function moveCircle(o,dx,dy,r){if(!blocked(o.x+dx,o.y,r))o.x+=dx;if(!blocked(o.x,o.y+dy,r))o.y+=dy}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angleDiff(a,b){let d=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI;return d}
function isDark(x,y){let lit=false;const lights=[[520,970],[850,520],[1120,500],[1410,1060],[300,330],[760,920]];for(const l of lights)if(Math.hypot(x-l[0],y-l[1])<170)lit=true;return !lit}
function promptText(t){const p=document.getElementById('prompt');p.textContent=t;p.style.display=t?'block':'none'}
function interact(){let nearItem=items.find(i=>!i.taken&&dist(player,i)<42);if(nearItem){nearItem.taken=true;if(nearItem.type==='med'){player.health=Math.min(100,player.health+35)}else player.weapon=nearItem.type;player.noise=35;return}let enemy=enemies.find(e=>e.alive&&dist(player,e)<48&&Math.abs(angleDiff(player.a,Math.atan2(e.y-player.y,e.x-player.x)))<1.2);if(enemy){enemy.alive=false;promptText('');player.weapon&& (player.weapon='');player.noise=20}}
function attack(){if(!player.weapon)return;for(const e of enemies){if(e.alive&&dist(player,e)<62){e.alive=false;break}}player.noise=60}
function throwWeapon(){if(!player.weapon)return;const type=player.weapon;thrown.push({x:player.x,y:player.y,vx:Math.cos(player.a)*520,vy:Math.sin(player.a)*520,type,life:1.4});player.weapon=null;player.noise=45}
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='f')throwWeapon()});document.getElementById('use').ontouchstart=e=>{e.preventStop;interact()};document.getElementById('throw').ontouchstart=e=>{e.preventStop;throwWeapon()};
let stickX=0,stickY=0;const stick=document.getElementById('stick'),knob=document.getElementById('stickknob');stick.addEventListener('touchmove',e=>{e.preventDefault();const r=stick.getBoundingClientRect(),t=e.touches[0];let x=t.clientX-(r.left+60),y=t.clientY-(r.top+60);const l=Math.hypot(x,y)||1;if(l>42){x=x/l*42;y=y/l*42}stickX=x/42;stickY=y/42;knob.style.transform=`translate(${x}px,${y}px)`},{passable:true});stick.addEventListener('touchend',()=>{stickX=stickY=0;knob.style.transform=''});
function update(dt){if(!started||gameOver)return;elapsed+=dt;player.crouch=!!keys['c'];let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;if(Math.abs(stickX)+Math.abs(stickY)>0){dx=stickX;dy=stickY}let len=Math.hypot(dx,dy);if(len>0){dx/=len;dy/=len;let running=keys['shift']&&!player.crouch;let speed=player.crouch?75:(running?245:145);moveCircle(player,dx*speed*dt,dy*speed*dt,16);player.a=Math.atan2(dy,dx);player.step+=dt*(running?12:7);if(running&&!isDark(player.x,player.y))player.noise=Math.max(player.noise,15)}
for(const t of thrown){t.x+=t.vx*dt;t.y+=t.vy*dt;t.vx*=.985;t.vy*=.985;t.life-=dt;if(!blocked(t.x,t.y,5)){for(const e of enemies)if(e.alive&&Math.hypot(t.x-e.x,t.y-e.y)<28)e.alive=false}}thrown=thrown.filter(t=>t.life>0&&!blocked(t.x,t.y,5));
for(const e of enemies){if(!e.alive)continue;let d=dist(player,e),dark=isDark(player.x,player.y),visible=!dark&&d<330&&Math.abs(angleDiff(e.a,Math.atan2(player.y-e.y,player.x-e.x)))<.72&&!lineBlocked(e.x,e.y,player.x,player.y);if(visible||d<75&&player.noise>5)e.alert=Math.min(1,e.alert+dt*.8);else e.alert=Math.max(0,e.alert-dt*.35);if(e.alert>.15){e.a=Math.atan2(player.y-e.y,player.x-e.x);if(d<28)player.health-=dt*28;if(d>38){moveCircle(e,Math.cos(e.a)*145*dt,Math.sin(e.a)*145*dt,14)}}else{let p=e.path[e.pi],pa=Math.atan2(p.y-e.y,p.x-e.x);e.a=pa;if(dist(e,p)<12)e.pi=(e.pi+1)%e.path.length;moveCircle(e,Math.cos(pa)*62*dt,Math.sin(pa)*62*dt,14)}}player.noise=Math.max(0,player.noise-dt*20);if(player.health<=0)gameOver=true;
cam.x+=(player.x-W/2-cam.x)*.08;cam.y+=(player.y-H/2-cam.y)*.08;cam.x=Math.max(0,Math.min(world.w-W,cam.x));cam.y=Math.max(0,Math.min(world.h-H,cam.y));
let nearItem=items.find(i=>!i.taken&&dist(player,i)<42);let nearEnemy=enemies.find(e=>e.alive&&dist(player,e)<48&&Math.abs(angleDiff(player.a,Math.atan2(e.y-player.y,e.x-player.x)))<1.2);promptText(nearItem?'[ E ] '+nearItem.name:(nearEnemy?'[ E ] EXECUTE TAKEDOWN':''));document.getElementById('health').style.width=Math.max(0,player.health)+'%';document.getElementById('clock').textContent=(()=>{let s=Math.floor(elapsed);return '00:'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')})();}
function lineBlocked(x1,y1,x2,y2){const n=10;for(let i=1;i<n;i++){let t=i/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(blocked(x,y,2))return true}return false}
function worldPoint(x,y){return{x:x-cam.x,y:y-cam.y}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#090a09';ctx.fillRect(0,0,W,H);
// streets
ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#171916';ctx.fillRect(170,170,1460,960);ctx.strokeStyle='#20221f';ctx.lineWidth=2;for(let x=180;x<1630;x+=90){ctx.beginPath();ctx.moveTo(x,170);ctx.lineTo(x,1130);ctx.stroke()}for(let y=180;y<1130;y+=80){ctx.beginPath();ctx.moveTo(170,y);ctx.lineTo(1630,y);ctx.stroke()}
// decals and trash
ctx.fillStyle='#111210';for(let i=0;i<34;i++){let x=(i*277)%1500+180,y=(i*173)%900+180;ctx.fillRect(x,y,5+((i*7)%18),2)}
for(const o of obstacles){ctx.fillStyle='#252723';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#151614';ctx.lineWidth=3;ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.fillStyle='rgba(170,165,140,.07)';for(let x=o.x+12;x<o.x+o.w;x+=35)ctx.fillRect(x,o.y+8,1,o.h-16)}
// shuttered storefronts
ctx.fillStyle='#111';ctx.fillRect(390,190,230,45);ctx.fillRect(770,180,180,40);for(let x=390;x<620;x+=14){ctx.fillStyle=x%28?'#20211f':'#151613';ctx.fillRect(x,190,10,45)}
// lights and glow
const lights=[[520,970],[850,520],[1120,500],[1410,1060],[300,330],[760,920]];for(let i=0;i<lights.length;i++){let l=lights[i];let flick=(Math.sin(elapsed*19+i*3)>.985?.3:1);ctx.globalCompositeOperation='lighter';let g=ctx.createRadialGradient(l[0],l[1],5,l[0],l[1],185);g.addColorStop(0,`rgba(210,190,120,${.22*flick})`);g.addColorStop(.25,`rgba(160,140,90,${.12*flick})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(l[0]-185,l[1]-185,370,370);ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(255,220,150,${.7*flick})`;ctx.fillRect(l[0]-3,l[1]-3,6,6);if(i%2===0){ctx.fillStyle='#34291b';ctx.beginPath();ctx.arc(l[0],l[1]+30,18,0,7);ctx.fill();ctx.fillStyle='#9b5d2d';ctx.beginPath();ctx.arc(l[0],l[1]+24,8,0,7);ctx.fill()}}
// darkness overlay
ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(170,170,1460,960);ctx.globalCompositeOperation='destination-out';for(const l of lights){let g=ctx.createRadialGradient(l[0],l[1],20,l[0],l[1],210);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(.4,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(l[0],l[1],210,0,7);ctx.fill()}ctx.globalCompositeOperation='source-over';
// items
for(const i of items){if(i.taken)continue;ctx.save();ctx.translate(i.x,i.y);ctx.fillStyle='#9d997f';if(i.type==='knife'||i.type==='pipe'){ctx.rotate(-.6);ctx.fillRect(-18,-3,36,6)}else if(i.type==='bat'){ctx.rotate(.8);ctx.fillRect(-4,-16,8,32)}else if(i.type==='brick')ctx.fillRect(-10,-6,20,12);else{ctx.fillStyle='#aaa';ctx.fillRect(-10,-7,20,14);ctx.fillStyle='#8d1e18';ctx.fillRect(-2,-5,4,10)}ctx.restore()}
// enemies
for(const e of enemies){if(!e.alive)continue;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.a);ctx.fillStyle=e.alert>.15?'#781b15':'#30322d';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.fillStyle='#55534a';ctx.fillRect(-9,-8,18,28);ctx.fillStyle='#1a1b18';ctx.fillRect(-13,-2,26,7);ctx.fillStyle='#aaa';ctx.fillRect(8,-3,24,5);ctx.restore();if(e.alert>.15){ctx.fillStyle='#b55';ctx.beginPath();ctx.arc(e.x,e.y-23,5,0,7);ctx.fill();ctx.fillRect(e.x-2,e.y-36,4,10)}}
// thrown
for(const t of thrown){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(elapsed*8);ctx.strokeStyle='#aaa';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(12,0);ctx.stroke();ctx.restore()}
// player
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.a);ctx.fillStyle=isDark(player.x,player.y)?'rgba(30,32,28,.55)':'#777762';ctx.beginPath();ctx.ellipse(0,0,player.crouch?12:10,player.crouch?14:20,0,0,7);ctx.fill();ctx.fillStyle='#1a1b18';ctx.beginPath();ctx.arc(0,-player.crouch?10:16,8,0,7);ctx.fill();ctx.strokeStyle='#656459';ctx.lineWidth=6;let swing=Math.sin(player.step)*5;if(player.crouch)swing*=.4;ctx.beginPath();ctx.moveTo(-7,4);ctx.lineTo(-12+swing,18);ctx.moveTo(7,4);ctx.lineTo(12-swing,18);ctx.stroke();if(player.weapon){ctx.strokeStyle='#aaa';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(8,-5);ctx.lineTo(24,-8);ctx.stroke()}ctx.restore();ctx.restore();
// safehouse marker
ctx.save();ctx.translate(-cam.x,-cam.y);ctx.strokeStyle='#a29d80';ctx.setLineDash([8,8]);ctx.strokeRect(1390,1040,150,75);ctx.restore();
if(gameOver){ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#b9b4a1';ctx.textAlign='center';ctx.font='bold 28px Courier New';ctx.fillText('SIGNAL LOST',W/2,H/2)}else if(enemies.every(e=>!e.alive)){ctx.fillStyle='#b9b4a1';ctx.textAlign='left';ctx.font='12px Courier New';ctx.fillText('DISTRICT CLEARED',22,H-48)}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
